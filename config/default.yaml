# Default settings for alfred-ocr.
#
# Precedence: environment variable > config/user.yaml >
#             ~/.config/alfred-ocr/config.yaml > this file > built-in defaults.
#
# Copy any line into config/user.yaml to change it; do not edit this file, it is
# overwritten on upgrade. Every key can also be set as an environment variable
# of the same name, which is how the Alfred workflow configures the workflow.
#
# Credentials do NOT belong here - put them in config/credentials.json (git
# ignores it) or in the Alfred workflow variables.
#
# PyYAML is used when installed; otherwise a built-in reader handles this flat
# "key: value" format, so no dependency is required.

# --- HTTP -------------------------------------------------------------------
http_timeout: 20.0
http_retries: 2
cnocr_timeout: 1.5

# Proxy for every outbound request, as "host:port" or a full URL. Some engines
# are unreachable from parts of the world without one. Write an empty value -
# http_proxy: "" - to connect directly; leaving the line out keeps the default
# below.
http_proxy: 127.0.0.1:7890

# --- Baidu ------------------------------------------------------------------
# CHN_ENG, ENG, JAP, KOR, FRE, SPA, POR, GER, ITA, RUS
baidu_language_type: CHN_ENG
baidu_max_image_bytes: 4194304
baidu_table_max_image_bytes: 8388608
baidu_token_ttl: 2160000

# --- Tencent ----------------------------------------------------------------
tencent_action: GeneralFastOCR
tencent_region: ap-shanghai
tencent_max_image_bytes: 3145728

# --- CnOCR ------------------------------------------------------------------
# 0: load the model in-process, 1: call a local FastAPI service
cnocr_serve: 0
cnocr_api: http://127.0.0.1:8501/ocr
cnocr_rec_model: doc-densenet_lite_136-gru
cnocr_det_model: ch_PP-OCRv3_det

# --- Multi-file recognition -------------------------------------------------
multi_file_path: /private/tmp/com.chandler.alfredocr
image_extensions: .png,.jpg,.jpeg,.bmp,.webp,.tiff

# --- Text clean-up ----------------------------------------------------------
# Insert a space on every CJK <-> Latin boundary: 使用 Python 3.11 开发
text_add_cjk_latin_space: true
# Give punctuation the width its neighbours ask for: 注意：内容 but f(x)=1
text_normalize_punctuation: true
# Fold full-width ASCII down to half-width: Ａ１ -> A1
text_fold_fullwidth_ascii: false

# --- Paragraph reconstruction ----------------------------------------------
# Lines are merged into paragraphs unless the signals below add up to
# paragraph_break_threshold. Thresholds are ratios of the measured page
# metrics, so they hold at any resolution. Raise a weight to split more often,
# lower it to merge more often.
paragraph_enabled: true
# Vertical step, relative to the usual line pitch, that starts a paragraph.
paragraph_gap_ratio: 1.45
# Characters of white space at the end of a line before it counts as "ended".
paragraph_short_line_chars: 3.0
# Latin wraps on whole words, so it needs a wider allowance than CJK.
paragraph_latin_short_factor: 1.6
# Characters of first-line indent that mark a new paragraph.
paragraph_indent_chars: 1.2
# Relative line-height change that marks a heading.
paragraph_height_tolerance: 0.3
paragraph_break_threshold: 1.0

# Legacy pixel nudges from before 5.0, still honoured.
baidu_ocr_spacing_offset: 8
baidu_ocr_spacing_variance: 15
baidu_ocr_width_offset: 50

# --- Diagnostics ------------------------------------------------------------
# Print the paragraph decisions and HTTP failures to stderr.
debug: false
